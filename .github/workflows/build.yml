name: Build Project

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: |
          if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew build
          
          else
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TestProject-JAR
          path: build/libs/*.jar