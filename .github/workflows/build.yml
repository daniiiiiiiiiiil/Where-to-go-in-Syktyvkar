name: Build Project

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew boorJar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TestProject-JAR
          path: build/libs/*.jar