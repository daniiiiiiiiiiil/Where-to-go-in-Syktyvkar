name: Build and Release

on:
  push:
    branches: [ master ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi
          
          echo "Building version: $VERSION"
          ./gradlew build -x test -Pversion=$VERSION

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: |
            ## Что нового
            - Автоматическая сборка из GitHub Actions
            - Номер сборки: #${{ github.run_number }}
            - Коммит: ${{ github.sha }}
            
            ## Как запустить
            ```bash
            java -jar TestProject-*.jar
            ```
            
            ### Для Windows
            Скачайте `start.bat` из репозитория

          draft: false
          prerelease: false
          files: |
            build/libs/*.jar
            start.bat
          generate_release_notes: true