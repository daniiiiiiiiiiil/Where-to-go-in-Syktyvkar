<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Main.css">
    <title>Финансовый обзор</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <a href="Main.html" id="Logo">FinTrack</a>
        <div class="profile-container">
            <img src="people.png" alt="Профиль" id="profile">
            <div class="profile-badge">Иван П.</div>
        </div>
    </header>
    
    <main>
        <div class="map-container">
            <iframe src="https://yandex.ru/map-widget/v1/?um=constructor%3A845e026f1a4ec18f4a5cc65499facb345fbe465e433af52027367da1274ee03f&amp;source=constructor" 
                    id="mapMain" frameborder="0"></iframe>
            <div class="map-overlay">
                <i class="fas fa-map-marker-alt"></i>
                <span>Ваши финансовые места</span>
            </div>
        </div>
        
        <div class="dashboard">
            <div class="controls">
                <a href="Map.html" class="control-btn" id="popular_places">
                    <i class="fas fa-fire"></i>
                    <span>Популярные места</span>
                </a>
                <a href="plan.html" class="control-btn" id="plan">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Запланированные места</span>
                </a>
            </div>
            
            <div class="financial-overview">
                <div class="chart-container">
                    <div class="circle-chart">
                        <svg viewBox="0 0 36 36" class="circle-chart-svg">
                            <path class="circle-bg"
                                d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <!-- Сегменты круга будут добавлены через JS -->
                        </svg>
                        <div class="circle-content">
                            <div class="total-amount">208 851,22 ₽</div>
                            <div class="total-companies">10 компаний</div>
                            <div class="month-label">Декабрь 2024</div>
                        </div>
                    </div>
                </div>
                
                <div class="expenses-legend">
                    <h3><i class="fas fa-chart-pie"></i> Детализация трат</h3>
                    <div class="legend-items">
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="footer-nav">
            <a href="Map.html" class="nav-btn active" id="MapButton">
                <i class="fas fa-map"></i>
                <span>Карта</span>
            </a>
            <a href="spending.html" class="nav-btn" id="WastesButton">
                <i class="fas fa-chart-bar"></i>
                <span>Траты</span>
            </a>
        </div>
    </footer>
    
    <script src="Circle.js"></script>
</body>
</html>
