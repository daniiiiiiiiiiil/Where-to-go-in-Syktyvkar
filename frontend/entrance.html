<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="entrance.css">
    <title>Вход | FinMap</title>
</head>
<body>
    <div id="EntanceBlock">
        <h1 id="nameBlock">Вход</h1>
        
        <div class="input-group">
            <div id="Login">Логин или Email</div>
            <input id="inputLogin" type="text" placeholder="Введите логин или email" required>
        </div>
        
        <div class="input-group">
            <div id="Password">Пароль</div>
            <input id="inputPassword" type="password" placeholder="Введите пароль" required>
        </div>
        
        <div id="rememberBlock">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe" id="rememberMeLabel">Запомнить меня</label>
        </div>
        
        <button id="buttonEntrance">Войти в аккаунт</button>
        
        <div class="forgot-password">
            <a href="#">Забыли пароль?</a>
        </div>
        
        <div id="Register">Нет аккаунта? <a href="Register.html">Зарегистрироваться</a></div>
    </div>
    
    <script src="entrance.js"></script>
</body>
</html>
