<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="spending.css">
    <title>Траты | FinTrack</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Шапка -->
    <header class="site-header">
        <div class="header-content">
            <a href="Main.html" class="logo">FinTrack</a>
            
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="Maps.html" class="nav-link">
                        <i class="fas fa-map"></i>
                        <span>Карта</span>
                    </a></li>
                    <li><a href="spending.html" class="nav-link active">
                        <i class="fas fa-chart-bar"></i>
                        <span>Траты</span>
                    </a></li>
                    <li><a href="Map.html" class="nav-link">
                        <i class="fas fa-fire"></i>
                        <span>Популярные места</span>
                    </a></li>
                    <li><a href="plan.html" class="nav-link">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Запланированные места</span>
                    </a></li>
                </ul>
            </nav>
            
            <div class="user-profile">
                <img src="people.png" alt="Профиль" class="profile-img">
                <span class="profile-name">Иван П.</span>
            </div>
        </div>
    </header>
    
    <!-- Основной контент -->
    <main class="main-content">
        <!-- Общая сумма -->
        <div class="total-summary">
            <h2 id="periodTitle">Общие расходы за месяц</h2>
            <div class="total-amount" id="totalAmount">208 851 ₽</div>
            <div class="companies" id="transactionsInfo">10 компаний • 54 транзакции</div>
        </div>
        
        <!-- Фильтры по периоду -->
        <div class="period-selector">
            <button class="period-button active" data-period="month">За месяц</button>
            <button class="period-button" data-period="week">За неделю</button>
            <button class="period-button" data-period="day">За день</button>
            <button class="period-button" data-period="year">За год</button>
        </div>
        
        <!-- Основной контейнер с кругом и легендой -->
        <div class="dashboard-container">
            <!-- Круговая диаграмма -->
            <div class="circle-chart">
                <svg viewBox="0 0 36 36" class="circle-chart-svg">
                    <path class="circle-bg"
                        d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831"
                    />
                    <!-- Сегменты будут добавлены через JS -->
                </svg>
                <div class="circle-content">
                    <div class="amount" id="circleAmount">208 851 ₽</div>
                    <div class="companies" id="circleCompanies">10 компаний</div>
                </div>
            </div>
            
            <!-- Легенда расходов -->
            <div class="expenses-legend">
                <div class="legend-header">Расходы по категориям</div>
                <div id="legendItems"></div>
            </div>
        </div>
        
        <!-- Последние транзакции -->
        <div class="transactions-section">
            <h2 class="transactions-header">Последние транзакции</h2>
            <ul id="blockUl">
                <!-- Транзакции будут добавлены через JS -->
            </ul>
        </div>
        
        <!-- Кнопка добавления траты -->
        <div class="add-expense" id="addExpenseButton">+</div>
    </main>
    
    <!-- Панель добавления трат -->
    <div class="add-expense-panel" id="addExpensePanel">
        <div class="panel-overlay" id="panelOverlay"></div>
        <div class="panel-content">
            <div class="panel-header">
                <h3>Добавить трату</h3>
                <button class="close-panel" id="closePanel">×</button>
            </div>
            <form id="expenseForm">
                <div class="input-group">
                    <label for="expenseName">Название</label>
                    <input type="text" id="expenseName" placeholder="Например: Продукты" required>
                </div>
                <div class="input-group">
                    <label for="expenseAmount">Сумма (₽)</label>
                    <input type="number" id="expenseAmount" placeholder="0" min="0" required>
                </div>
                <div class="input-group">
                    <label for="expenseCategory">Категория</label>
                    <select id="expenseCategory">
                        <option value="Продукты">Продукты</option>
                        <option value="Транспорт">Транспорт</option>
                        <option value="Рестораны">Рестораны</option>
                        <option value="Топливо">Топливо</option>
                        <option value="Развлечения">Развлечения</option>
                        <option value="Другое">Другое</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="expenseDate">Дата</label>
                    <input type="date" id="expenseDate" required>
                </div>
                <button type="submit" class="submit-btn">Добавить трату</button>
            </form>
        </div>
    </div>
    
    <script src="spending.js"></script>
    <script src="Circle.js"></script>
</body>
</html>
